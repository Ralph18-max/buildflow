<div class="modal-backdrop" (click)="fermer.emit()"></div>

<div class="modal-box">
  <div class="modal-header">
    <h2>Changer mon mot de passe</h2>
    <button class="modal-close" (click)="fermer.emit()">
      <span class="material-icons">close</span>
    </button>
  </div>

  @if (succes) {
    <div class="alert-success">
      <span class="material-icons">check_circle</span> {{ succes }}
    </div>
  }
  @if (erreur) {
    <div class="alert-error">
      <span class="material-icons">error</span> {{ erreur }}
    </div>
  }

  <div class="form-group">
    <label>Mot de passe actuel</label>
    <div class="input-wrap">
      <input [type]="showAncien ? 'text' : 'password'" [(ngModel)]="ancien" placeholder="••••••••" />
      <button type="button" class="eye-btn" (click)="showAncien = !showAncien">
        <span class="material-icons">{{ showAncien ? 'visibility_off' : 'visibility' }}</span>
      </button>
    </div>
  </div>

  <div class="form-group">
    <label>Nouveau mot de passe</label>
    <div class="input-wrap">
      <input [type]="showNouveau ? 'text' : 'password'" [(ngModel)]="nouveau" placeholder="••••••••" />
      <button type="button" class="eye-btn" (click)="showNouveau = !showNouveau">
        <span class="material-icons">{{ showNouveau ? 'visibility_off' : 'visibility' }}</span>
      </button>
    </div>
    <small [class.ok]="nouveau.length >= 8">Minimum 8 caractères</small>
  </div>

  <div class="form-group">
    <label>Confirmer le nouveau mot de passe</label>
    <div class="input-wrap">
      <input [type]="showConfirm ? 'text' : 'password'" [(ngModel)]="confirmation" placeholder="••••••••" />
      <button type="button" class="eye-btn" (click)="showConfirm = !showConfirm">
        <span class="material-icons">{{ showConfirm ? 'visibility_off' : 'visibility' }}</span>
      </button>
    </div>
    @if (confirmation && nouveau !== confirmation) {
      <small class="err">Les mots de passe ne correspondent pas</small>
    }
  </div>

  <button class="btn-primary" [disabled]="!valide || loading" (click)="soumettre()">
    @if (loading) { <span class="spin">⟳</span> }
    Modifier le mot de passe
  </button>
</div>
